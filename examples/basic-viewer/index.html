<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>copcesium basic-viewer example</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; }
      #panel {
        position: absolute; top: 10px; left: 10px; z-index: 1;
        background: white; padding: 10px; font: 13px sans-serif;
        display: flex; flex-direction: column; gap: 6px; width: 320px;
      }
      #panel label { display: flex; justify-content: space-between; gap: 8px; }
      #datasetLabel { flex-direction: column; align-items: stretch; gap: 4px; }
      #datasetSelect { width: 100%; min-width: 0; }
      #classChecks { display: flex; flex-wrap: wrap; gap: 2px 10px; }
      #classChecks label { justify-content: flex-start; gap: 4px; white-space: nowrap; }
      #panel hr { border: none; border-top: 1px solid #ddd; }
      #urlInput { width: 100%; }
      #error { color: red; white-space: pre-wrap; }
      #status { color: #555; }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div id="panel">
      <label id="datasetLabel">sample data:
        <select id="datasetSelect"></select>
      </label>
      <input id="urlInput" type="text" placeholder="COPC URL" />
      <div>
        <button id="loadBtn">Load</button>
        <button id="reloadBtn" disabled>Remove &amp; reload</button>
      </div>
      <label>pixelSize: <span id="pixelSizeValue"></span>
        <input id="pixelSize" type="range" min="1" max="10" step="1" value="2" />
      </label>
      <label>sseThreshold: <span id="sseThresholdValue"></span>
        <input id="sseThreshold" type="range" min="50" max="1000" step="10" value="250" />
      </label>
      <hr />
      <label>colorMode:
        <select id="colorMode">
          <option value="rgb">rgb</option>
          <option value="intensity" selected>intensity</option>
          <option value="classification">classification</option>
          <option value="elevation">elevation</option>
        </select>
      </label>
      <div>classificationFilter:</div>
      <div id="classChecks"></div>
      <hr />
      <div id="status"></div>
      <div id="error"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
