name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm's OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >=11.5.1; setup-node's bundled
      # npm may be older, so pin an explicit floor here rather than trusting
      # whatever ships with the node-version above.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # Runs before `npm test` so the dist/-output regression guards in
      # src/build.test.ts (which are skipped via it.runIf until dist/
      # exists) actually execute instead of silently no-op'ing.
      - run: npm run build

      - run: npm test

      - run: npm run lint

      - run: npm publish --provenance --access public
