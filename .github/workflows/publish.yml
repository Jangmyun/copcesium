name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm's OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >=11.5.1; setup-node's bundled
      # npm may be older, so pin an explicit floor here rather than trusting
      # whatever ships with the node-version above.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # Must come before the tests. src/build.test.ts guards the #54 worker-404
      # regression by reading dist/copc-cesium.mjs, and those assertions are
      # `it.runIf(existsSync(...))` — with dist/ gitignored, a fresh checkout has
      # no build output, so running the tests first silently skips them
      # ("2 passed | 2 skipped") and the job still goes green. A broken build
      # output would publish unnoticed, which is exactly how 1.0.0 shipped.
      #
      # `npm run build` also runs via this package's own `prepublishOnly`, but
      # running it explicitly here lets the job fail before publishing if the
      # build itself is broken.
      - run: npm run build

      - run: npm run test:run

      - run: npm run lint

      - run: npm publish --provenance --access public
